---
layout: default
---
<div class="home">
  {% if page.content != "" %}
  <div class="home-intro">{{ content }}</div>
  {% endif %}

  <h2 class="archive-heading">最新記事</h2>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <span class="post-list-date">{{ post.date | date: "%Y.%m.%d" }}</span>
      <a class="post-list-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</div>
