---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>
      {% if page.categories %}
        {% for cat in page.categories %}<span class="post-category">{{ cat }}</span>{% endfor %}
      {% endif %}
    </p>
  </header>

  {% include disclosure-banner.html %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
