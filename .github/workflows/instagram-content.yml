name: Instagram content

on:
  schedule:
    # 毎日07:00 JST（新しく公開された記事のInstagram下書きをキャッチアップ）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate carousel + Reels drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_instagram_content.py

      - name: Commit and push any changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -e sns_drafts ]; then git add sns_drafts; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: Instagramカルーセル/リール下書きを生成"
            git push
          fi
