title: 防災ポータブル電源ラボ
description: >-
  ポータブル電源・防災グッズの選び方や比較を発信するブログです。
  当サイトはAmazonアソシエイト・プログラムおよび楽天アフィリエイトの参加者です。
baseurl: "/bousai-power"
url: "https://ikebukuroCitys000.github.io"
lang: ja
timezone: Asia/Tokyo

# Amazonアソシエイト・トラッキングID（審査通過後に設定。全商品リンクに自動付与されます）
amazon_associate_tag: "bababauru-22"

# 楽天アフィリエイトID（「どこでもリンク」形式で全商品リンクに自動付与されます）
rakuten_affiliate_id: "562f878b.0286961a.562f878c.30d1c03c"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM

show_excerpts: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - scripts/
  - data/
  - requirements.txt
  - "*.pyc"
  - venv/
  - README.md
